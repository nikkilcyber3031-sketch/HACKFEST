
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HACKFEST | Admin Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(0,234,255,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 25%,
            rgba(155,92,255,.17),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(255,60,172,.12),
            transparent 35%
        ),
        #050816;

    overflow:hidden;
}


/* =========================================
   GRID BACKGROUND
========================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    opacity:.22;
    pointer-events:none;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:50px 50px;
}


/* =========================================
   GLOW ORBS
========================================= */

.orb{
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    pointer-events:none;

    animation:float 8s ease-in-out infinite;
}

.orb1{
    width:280px;
    height:280px;

    background:#00eaff;
    opacity:.12;

    left:-100px;
    top:5%;
}

.orb2{
    width:320px;
    height:320px;

    background:#9b5cff;
    opacity:.13;

    right:-120px;
    bottom:5%;

    animation-delay:2s;
}

.orb3{
    width:180px;
    height:180px;

    background:#ff3cac;
    opacity:.10;

    left:45%;
    top:-80px;

    animation-delay:4s;
}

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-25px);
    }

}


/* =========================================
   TOP BAR
========================================= */

.top-bar{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:72px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    border-bottom:1px solid rgba(255,255,255,.08);

    background:rgba(5,8,22,.65);

    backdrop-filter:blur(18px);

    z-index:10;
}


/* =========================================
   LOGO
========================================= */

.logo{

    display:flex;
    align-items:center;

    gap:12px;
}

.logo-mark{

    width:42px;
    height:42px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#00eaff;

    font-weight:900;

    border:1px solid rgba(0,234,255,.5);

    box-shadow:
        0 0 20px rgba(0,234,255,.12);
}

.logo-text strong{

    display:block;

    letter-spacing:2px;

    font-size:17px;
}

.logo-text span{

    display:block;

    margin-top:3px;

    font-size:9px;

    color:#7f89a7;

    letter-spacing:1.5px;
}


/* =========================================
   HOME BUTTON
========================================= */

.home-btn{

    color:#dce4ff;

    text-decoration:none;

    font-size:12px;

    padding:10px 16px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.12);

    transition:.3s;
}

.home-btn:hover{

    color:#00eaff;

    border-color:#00eaff;

    box-shadow:
        0 0 18px rgba(0,234,255,.12);
}


/* =========================================
   LOGIN WRAPPER
========================================= */

.login-wrapper{

    width:min(430px,92%);

    position:relative;

    z-index:2;
}


/* =========================================
   LOGIN CARD
========================================= */

.login-card{

    padding:38px;

    border-radius:26px;

    border:1px solid rgba(255,255,255,.11);

    background:rgba(255,255,255,.045);

    backdrop-filter:blur(22px);

    box-shadow:

        0 35px 100px rgba(0,0,0,.45),

        inset 0 1px 0 rgba(255,255,255,.04);

    animation:cardIn .7s ease;
}

@keyframes cardIn{

    from{

        opacity:0;

        transform:
            translateY(25px)
            scale(.97);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================
   ADMIN ICON
========================================= */

.admin-icon{

    width:72px;
    height:72px;

    margin:0 auto 22px;

    border-radius:22px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:30px;

    color:#00eaff;

    border:1px solid rgba(0,234,255,.35);

    background:rgba(0,234,255,.06);

    box-shadow:
        0 0 35px rgba(0,234,255,.12);

    animation:
        iconPulse 3s ease-in-out infinite;
}

@keyframes iconPulse{

    0%,100%{
        box-shadow:
            0 0 25px rgba(0,234,255,.10);
    }

    50%{
        box-shadow:
            0 0 40px rgba(0,234,255,.25);
    }

}


/* =========================================
   LOGIN HEADING
========================================= */

.login-heading{

    text-align:center;

    margin-bottom:30px;
}

.login-heading .badge{

    display:inline-block;

    padding:7px 13px;

    border-radius:30px;

    color:#00eaff;

    border:1px solid rgba(0,234,255,.3);

    font-size:9px;

    letter-spacing:2px;

    margin-bottom:14px;
}

.login-heading h1{

    font-size:30px;

    letter-spacing:2px;
}

.login-heading p{

    color:#8993b0;

    font-size:12px;

    margin-top:8px;

    line-height:1.6;
}


/* =========================================
   FORM FIELD
========================================= */

.field{

    margin-bottom:20px;
}

label{

    display:block;

    color:#b9c1da;

    font-size:11px;

    letter-spacing:1px;

    margin-bottom:9px;
}


/* =========================================
   INPUT BOX
========================================= */

.input-box{

    position:relative;

    width:100%;
}


/* =========================================
   INPUT ICON
========================================= */

.input-icon{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#68728e;

    font-size:15px;

    pointer-events:none;

    z-index:2;
}


/* =========================================
   INPUT
========================================= */

.input-box input{

    width:100%;

    height:50px;

    padding:
        0
        15px
        0
        43px;

    border-radius:12px;

    outline:none;

    color:#fff;

    background:rgba(0,0,0,.25);

    border:
        1px solid
        rgba(255,255,255,.12);

    transition:.3s;

    font-size:13px;
}

.input-box input:focus{

    border-color:#00eaff;

    box-shadow:
        0 0 20px
        rgba(0,234,255,.08);
}

.input-box input::placeholder{

    color:#59627c;
}


/* =========================================
   PASSWORD BOX
========================================= */

.password-box input{

    padding-right:70px;
}


/* =========================================
   SHOW / HIDE
========================================= */

.password-toggle{

    position:absolute;

    right:10px;

    top:50%;

    transform:translateY(-50%);

    width:50px;

    height:32px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#75809d;

    cursor:pointer;

    font-size:9px;

    font-weight:700;

    letter-spacing:.5px;

    border-radius:7px;

    transition:.25s;

    z-index:3;
}

.password-toggle:hover{

    color:#00eaff;

    background:
        rgba(0,234,255,.07);
}


/* =========================================
   LOGIN BUTTON
========================================= */

.login-btn{

    width:100%;

    padding:16px;

    border:0;

    border-radius:12px;

    cursor:pointer;

    font-size:13px;

    font-weight:900;

    letter-spacing:1px;

    color:#041018;

    background:
        linear-gradient(
            90deg,
            #00eaff,
            #8b7cff
        );

    box-shadow:
        0 12px 35px
        rgba(0,234,255,.2);

    transition:.3s;
}

.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 18px 45px
        rgba(0,234,255,.3);
}

.login-btn:active{

    transform:scale(.98);
}


/* =========================================
   ERROR MESSAGE
========================================= */

.error{

    display:none;

    padding:12px;

    margin-bottom:18px;

    border-radius:10px;

    text-align:center;

    font-size:11px;

    color:#ff8fae;

    background:
        rgba(255,60,108,.07);

    border:
        1px solid
        rgba(255,60,108,.2);

    animation:errorShake .3s ease;
}

@keyframes errorShake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-5px);
    }

    75%{
        transform:translateX(5px);
    }
}


/* =========================================
   FOOTER
========================================= */

.login-footer{

    text-align:center;

    margin-top:24px;

    color:#606a87;

    font-size:10px;

    letter-spacing:.5px;
}

.security{

    margin-top:12px;

    color:#00cfa8;

    font-size:10px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .top-bar{

        padding:0 4%;
    }

    .login-card{

        padding:28px 22px;
    }

    .logo-text strong{

        font-size:15px;
    }

    .home-btn{

        padding:8px 12px;

        font-size:10px;
    }

    .login-heading h1{

        font-size:26px;
    }

}

</style>
</head>


<body>


<!-- =========================================
     BACKGROUND
========================================= -->

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>


<!-- =========================================
     TOP BAR
========================================= -->

<header class="top-bar">

    <div class="logo">

        <div class="logo-mark">
            HF
        </div>

        <div class="logo-text">

            <strong>HACKFEST</strong>

            <span>
                ADMIN CONTROL PANEL
            </span>

        </div>

    </div>


    <a href="/" class="home-btn">
    ← HOME
</a>
</header>


<!-- =========================================
     LOGIN
========================================= -->

<main class="login-wrapper">

    <div class="login-card">


        <!-- ADMIN ICON -->

        <div class="admin-icon">
            🔐
        </div>


        <!-- HEADING -->

        <div class="login-heading">

            <div class="badge">
                RESTRICTED ACCESS
            </div>

            <h1>
                Admin Login
            </h1>

            <p>
                Sign in to access the HACKFEST
                control panel.
            </p>

        </div>


        <!-- ERROR -->

        <div
            class="error"
            id="errorMessage"
        >
            Invalid Admin ID or Password.
        </div>


        <!-- FORM -->

        <form id="loginForm">


            <!-- ADMIN ID -->

            <div class="field">

                <label>
                    ADMIN ID
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        id="adminId"
                        placeholder="Enter admin ID"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label>
                    PASSWORD
                </label>

                <div
                    class="input-box password-box"
                >

                    <span class="input-icon">
                        🔑
                    </span>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <span
                        class="password-toggle"
                        id="togglePassword"
                    >
                        SHOW
                    </span>

                </div>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
            >
                LOGIN TO DASHBOARD →
            </button>

        </form>


        <!-- FOOTER -->

        <div class="login-footer">

            HACKFEST • ADMINISTRATION

            <div class="security">
                ● Secure Admin Access
            </div>

        </div>


    </div>

</main>


<script>


/* =========================================
   DEMO ADMIN LOGIN
========================================= */

const ADMIN_ID = "admin";

const ADMIN_PASSWORD = "hackfest@123";


/* =========================================
   LOGIN FORM
========================================= */

document
.getElementById("loginForm")
.addEventListener("submit", function(event){

    event.preventDefault();


    const id =
        document
        .getElementById("adminId")
        .value
        .trim();


    const password =
        document
        .getElementById("adminPassword")
        .value;


    const error =
        document
        .getElementById("errorMessage");


    /* HIDE OLD ERROR */

    error.style.display = "none";


    /* CHECK LOGIN */

    if(
        id === ADMIN_ID &&
        password === ADMIN_PASSWORD
    ){

        /*
            Save login session
        */

        sessionStorage.setItem(
            "hackfestAdminLoggedIn",
            "true"
        );


        /*
            Dashboard redirect
        */

        window.location.href =
            "admin-dashboard";

    }

    else{

        error.style.display = "block";

        document
        .getElementById("adminPassword")
        .value = "";

    }

});


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

document
.getElementById("togglePassword")
.addEventListener("click", function(){

    const password =
        document
        .getElementById("adminPassword");


    if(password.type === "password"){

        password.type = "text";

        this.textContent = "HIDE";

    }

    else{

        password.type = "password";

        this.textContent = "SHOW";

    }

});


/* =========================================
   REMOVE ERROR WHILE TYPING
========================================= */

document
.getElementById("adminId")
.addEventListener("input",function(){

    document
    .getElementById("errorMessage")
    .style.display = "none";

});


document
.getElementById("adminPassword")
.addEventListener("input",function(){

    document
    .getElementById("errorMessage")
    .style.display = "none";

});

</script>

</body>
</html>
